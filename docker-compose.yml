services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    working_dir: /var/www/html

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: akademija
      MYSQL_USER: akademija
      MYSQL_PASSWORD: akademija
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  vendor: