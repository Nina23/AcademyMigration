# Test server only: Apache prefork limits for a container with a 1 GB memory limit
# (docker-compose.test-server.yml). Debian's default allows 150 workers; at roughly 40–60 MB per
# PHP worker that could exceed the limit under parallel requests (e.g. the O9 rounds at
# parallelism 12) and get workers killed. 16 workers cover parallelism 12 with headroom.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    ServerLimit             16
    MaxRequestWorkers       16
    MaxConnectionsPerChild 500
</IfModule>
